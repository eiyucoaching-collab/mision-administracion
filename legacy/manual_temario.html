<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Oficial Desarrollado E1 | Ministerio de Defensa y AGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1d;
      --sidebar-bg: #0d1424;
      --content-bg: #111827;
      --border: #1e293b;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.2);
      --purple: #c084fc;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.7;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR / ÍNDICE DE TEMAS */
    aside {
      width: 320px;
      min-width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .sidebar-header span {
      font-size: 0.7rem;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .topic-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .topic-item {
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .topic-item:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .topic-item.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-weight: 600;
    }

    .topic-num {
      min-width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .topic-item.active .topic-num {
      background: var(--primary);
      color: #041019;
    }

    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .nav-link-btn:hover {
      color: #fff;
      border-color: var(--primary);
    }

    /* CONTENEDOR PRINCIPAL DE LECTURA */
    main {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 30px 48px 100px;
      background: var(--bg);
    }

    .content-area {
      max-width: 860px;
      margin: 0 auto;
    }

    /* ENCABEZADO DEL TEMA */
    .theme-header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .theme-tag {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--purple);
      margin-bottom: 6px;
      display: inline-block;
    }

    .theme-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .theme-law-ref {
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: 600;
    }

    /* SECCIONES Y EPÍGRAFES */
    .epigrafe-block {
      margin-bottom: 36px;
    }

    .epigrafe-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .epigrafe-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: 2px;
      display: inline-block;
    }

    .prose {
      font-size: 0.98rem;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .prose p {
      margin-bottom: 14px;
    }

    /* CAJA LITERAL BOE */
    .boe-quote {
      background: rgba(15, 23, 42, 0.7);
      border-left: 3px solid var(--purple);
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      margin: 16px 0;
      font-size: 0.92rem;
      color: #e2e8f0;
      font-style: italic;
    }

    .boe-quote-author {
      font-style: normal;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--purple);
      margin-top: 6px;
      display: block;
      text-transform: uppercase;
    }

    /* ALERTA DE EXAMEN / TRAMPA DEL TRIBUNAL */
    .exam-alert {
      background: rgba(245, 158, 11, 0.08);
      border: 1.5px solid rgba(245, 158, 11, 0.3);
      border-radius: 14px;
      padding: 16px 20px;
      margin: 20px 0;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .exam-alert-icon {
      font-size: 24px;
      line-height: 1;
    }

    .exam-alert-content h4 {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .exam-alert-content p {
      font-size: 0.9rem;
      color: #fef3c7;
      line-height: 1.5;
    }

    /* TABLA RESUMEN INTERACTIVA DENTRO DEL TEMA */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .data-table th {
      background: rgba(15, 23, 42, 0.9);
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: var(--content-bg);
      color: #f1f5f9;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .highlight-bold {
      font-weight: 700;
      color: var(--primary);
    }

    /* AUTOEVALUACIÓN RÁPIDA AL FINAL DEL TEMA */
    .checkpoint-card {
      background: rgba(6, 182, 212, 0.05);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 16px;
      padding: 24px;
      margin-top: 40px;
    }

    .checkpoint-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .checkpoint-header h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .checkpoint-q {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
    }

    .checkpoint-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chk-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #cbd5e1;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .chk-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .chk-btn.correct {
      background: rgba(16, 185, 129, 0.15) !important;
      border-color: #10b981 !important;
      color: #34d399 !important;
      font-weight: 700;
    }

    .chk-btn.wrong {
      background: rgba(244, 63, 94, 0.15) !important;
      border-color: #f43f5e !important;
      color: #fb7185 !important;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      body { flex-direction: column; height: auto; overflow: auto; }
      aside { width: 100%; min-width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 20px 16px 80px; }
    }
  </style>
</head>

              <p>La Constitución Española de 1978 es la norma suprema del ordenamiento jurídico español. Es una constitución <strong>escrita, extensa (169 artículos), consensuada, rígida</strong> (procedimiento agravado de reforma) y de origen popular.</p>

    class ManualViewer {
      constructor() {
        this.currentTopicId = 1;
        this.renderSidebar();
        this.loadTopic(1);
      }

      renderSidebar() {
        const list = document.getElementById('topicList');
        list.innerHTML = '';
        SYLLABUS_CHAPTERS.forEach(ch => {
          const item = document.createElement('div');
          item.className = `topic-item ${ch.id === this.currentTopicId ? 'active' : ''}`;
          item.onclick = () => this.loadTopic(ch.id);
          item.innerHTML = `
            <div class="topic-num">${ch.id}</div>
            <div style="flex: 1;">
              <div style="font-size: 0.7rem; color: #a855f7; font-weight: 700;">TEMA ${ch.id}</div>
              <div style="line-height: 1.3;">${ch.title.split(':')[0]}</div>
            </div>
          `;
          list.appendChild(item);
        });
      }

      loadTopic(id) {
        this.currentTopicId = id;
        this.renderSidebar();

        const ch = SYLLABUS_CHAPTERS.find(c => c.id === id);
        if (!ch) return;

        const container = document.getElementById('contentArea');
        let html = `
          <div class="theme-header">
            <span class="theme-tag">${ch.block}</span>
            <h1 class="theme-title">${ch.title}</h1>
            <div class="theme-law-ref">⚖️ Base Legal: ${ch.lawRef}</div>
          </div>
        `;

        ch.sections.forEach(sec => {
          html += `
            <div class="epigrafe-block">
              <h2 class="epigrafe-title">${sec.title}</h2>
              <div class="prose">${sec.content}</div>
          `;

          if (sec.quote) {
            html += `
              <div class="boe-quote">
                "${sec.quote}"
                <span class="boe-quote-author">${sec.quoteSource}</span>
              </div>
            `;
          }

          if (sec.table) {
            html += `
              <table class="data-table">
                <thead>
                  <tr>${sec.table.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                </thead>
                <tbody>
                  ${sec.table.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}
                </tbody>
              </table>
            `;
          }

          if (sec.content2) {
            html += `<div class="prose">${sec.content2}</div>`;
          }

          if (sec.alert) {
            html += `
              <div class="exam-alert">
                <span class="exam-alert-icon">⚠️</span>
                <div class="exam-alert-content">
                  <h4>${sec.alert.title}</h4>
                  <p>${sec.alert.desc}</p>
                </div>
              </div>
            `;
          }

          html += `</div>`;
        });

        // Autoevaluación al final
        if (ch.quiz) {
          html += `
            <div class="checkpoint-card">
              <div class="checkpoint-header">
                <span style="font-size: 22px;">🎯</span>
                <h3>Comprueba si has dominado el Tema ${ch.id}</h3>
              </div>
              <p class="checkpoint-q">${ch.quiz.q}</p>
              <div class="checkpoint-options" id="quizOpts">
                ${ch.quiz.options.map((opt, i) => `
                  <button class="chk-btn" onclick="viewer.checkQuiz(${i}, ${ch.quiz.correct}, '${ch.quiz.exp.replace(/'/g, "\\'")}')">
                    ${opt}
                  </button>
                `).join('')}
              </div>
              <div id="quizExp" style="display: none; margin-top: 14px; font-size: 0.9rem; padding: 12px; border-radius: 8px;"></div>
            </div>
          `;
        }

        container.innerHTML = html;
        document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
      }

      checkQuiz(idx, correct, exp) {
        const buttons = document.querySelectorAll('.chk-btn');
        buttons.forEach((btn, i) => {
          btn.disabled = true;
          if (i === correct) btn.classList.add('correct');
          if (i === idx && idx !== correct) btn.classList.add('wrong');
        });

        const expEl = document.getElementById('quizExp');
        if (expEl) {
          expEl.style.display = 'block';
          if (idx === correct) {
            expEl.style.background = 'rgba(16, 185, 129, 0.15)';
            expEl.style.color = '#34d399';
            expEl.innerHTML = `<strong>¡Excelente! Respuesta Correcta (+1.00):</strong> ${exp}`;
          } else {
            expEl.style.background = 'rgba(244, 63, 94, 0.15)';
            expEl.style.color = '#fb7185';
            expEl.innerHTML = `<strong>Fallo en la autoevaluación (-0.33):</strong> ${exp}`;
          }
        }
      }
    }

    const viewer = new ManualViewer();
  </script>
</body>
</html>
